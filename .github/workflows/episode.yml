name: ZMB 2D code-drawn episode preview (no AI)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (sirf video render, koi post nahi)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: episode-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_USERNAME: ${{ secrets.IG_USERNAME }}
      ZMB_LOCAL_AI_ENABLED: "0"
      ZMB_NO_AI: "1"
      ZMB_PUBLISH_ENABLED: "0"
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync latest main state
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --prefer-binary -r scripts/requirements.txt

      - name: System deps (ffmpeg + fonts)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Retry transient Ubuntu mirror/network errors, but do not hang the cycle forever.
          for attempt in 1 2 3; do
            if timeout 90s sudo apt-get update -qq; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-get update failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate Python and story engine
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python scripts/engine.py --selftest

      - name: Render cinematic Day 1 draft only (never publish)
        run: python scripts/preview_day1.py --video

      - name: Upload reel artifact (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reel-debug
          path: |
            out/*.mp4
            out/caption.txt
            out/episode.json
            out/day1_visual_manifest.json
            out/stills/*.png
          if-no-files-found: ignore
          retention-days: 5
