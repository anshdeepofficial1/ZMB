name: Episode Cycle

on:
  schedule:
    # India-local times. Prepare at 18:17; retry/publish at 19:17 and
    # retry through 20:47 if GitHub or Instagram is temporarily delayed.
    - cron: "17 18 * * *"
      timezone: "Asia/Kolkata"
    - cron: "17,47 19 * * *"
      timezone: "Asia/Kolkata"
    - cron: "17,47 20 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (sirf video render, koi post nahi)"
        type: boolean
        default: false
      force_publish:
        description: "Force publish (time/date gate bypass)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: episode-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_USERNAME: ${{ secrets.IG_USERNAME }}
      ZMB_LOCAL_AI_ENABLED: "1"
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync latest main state
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r scripts/requirements.txt

      - name: Restore local model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: zmb-qwen-1-5b-q4km-91cad51170dc346986eccefdc2dd33a9da36ead9

      - name: System deps (ffmpeg + fonts)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Retry transient Ubuntu mirror/network errors, but do not hang the cycle forever.
          for attempt in 1 2 3; do
            if timeout 90s sudo apt-get update -qq; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-get update failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate Python and story engine
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python scripts/engine.py --selftest

      - name: Run cycle
        env:
          DRY: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force_publish }}
        run: |
          ARGS=""
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force-publish"; fi
          python scripts/run_cycle.py $ARGS

      - name: Upload reel artifact (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reel-debug
          path: |
            out/*.mp4
            out/caption.txt
            out/episode.json
          if-no-files-found: ignore
          retention-days: 5

      - name: Commit state
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "zombie-bot"
          git config user.email "zombie-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi

          git commit -m "state: update $(date -u +%FT%TZ)"
          # Another commit may reach main while this long render is running.
          # Rebase the state commit on the newest main before pushing, rather than
          # silently losing state or leaving a successful Instagram post unrecorded.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::State rebase conflicted; refusing to overwrite main"
              exit 1
            fi
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Could not push state after 3 attempts"
          exit 1
