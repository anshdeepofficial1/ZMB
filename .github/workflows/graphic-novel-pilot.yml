name: ZMB graphic novel 2D pilot (no publishing)
on:
  push:
    branches: [experiment/graphic-novel-2d-rebuild]
    paths:
      - "scripts/graphic_novel.py"
      - "scripts/preview_graphic_novel.py"
      - "tests/test_graphic_novel.py"
      - ".github/workflows/graphic-novel-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zmb-graphic-novel-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          pip install --prefer-binary -r scripts/requirements.txt
      - name: Run full regression suite
        env:
          ZMB_NO_AI: "1"
          ZMB_LOCAL_AI_ENABLED: "0"
        run: python -m unittest discover -s tests -v
      - name: Render seven all-new graphic novel scenes
        env:
          ZMB_NO_AI: "1"
          ZMB_LOCAL_AI_ENABLED: "0"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          python scripts/preview_graphic_novel.py
          VIDEO="$(find out -maxdepth 1 -name '*.mp4' -type f -print -quit)"
          test -s "$VIDEO"
          python scripts/verify_2d_video.py "$VIDEO"
          ffmpeg -v error -i "$VIDEO" -vf 'fps=1/2,scale=216:384,tile=5x4' -frames:v 1 out/contact-sheet.jpg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zmb-graphic-novel-pilot
          path: |
            out/*.mp4
            out/*.json
            out/contact-sheet.jpg
          if-no-files-found: warn
          retention-days: 7
