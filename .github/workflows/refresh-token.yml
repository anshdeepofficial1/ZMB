name: Refresh IG Token

on:
  schedule:
    # Har mahine 1st aur 15th, 09:47 IST (04:17 UTC)
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install PyNaCl requests

      - name: Refresh token + update secret
        run: python scripts/refresh_token.py
