name: Validate Python and Scheduler

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "skills/**"
      - "content/cast_bible.json"
      - "content/prop_bible.json"
      - "content/shot_directions.json"
      - "workflows/zmb/**"
      - "content/scenarios.json"
      - "config.example.json"
      - "tests/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/episode.yml"
  workflow_dispatch:
    inputs:
      render_preview:
        description: "Render an offline Day 1 preview MP4 (slow; never publishes)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zmb-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r scripts/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q scripts tests

      - name: Story engine self-test
        run: python scripts/engine.py --selftest

      - name: Scheduler, cinematic and safety regression tests
        run: python -m unittest discover -s tests -v

      - name: Offline prompt-generation smoke test (never calls GPU or Instagram)
        run: |
          python scripts/visual_manifest.py --day1
          python scripts/comfyui_cinematic.py --day1 --dry-run

      - name: Ensure publishing is disabled
        run: |
          python -c "import json; c=json.load(open('config.example.json')); assert c['publishing_enabled'] is False and c['cinematic_release_approved'] is False"

  preview-day1:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_preview }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r scripts/requirements.txt

      - name: Restore local model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: zmb-qwen-1-5b-q4km-91cad51170dc346986eccefdc2dd33a9da36ead9

      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Render Day 1 preview (no Instagram publishing)
        env:
          ZMB_LOCAL_AI_ENABLED: "1"
        run: python scripts/preview_day1.py --video

      - name: Upload Day 1 cinematic draft
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmb-day1-preview
          path: |
            out/*.mp4
            out/caption.txt
            out/episode.json
            out/day1_visual_manifest.json
          if-no-files-found: error
          retention-days: 5
