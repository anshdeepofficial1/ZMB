name: Validate code-only 2D animation and scheduler

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "skills/**"
      - "content/cast_bible.json"
      - "content/scenarios.json"
      - "config.example.json"
      - "tests/**"
      - ".github/workflows/validate.yml"
      - ".github/workflows/episode.yml"
  workflow_dispatch:
    inputs:
      render_preview:
        description: "Render a Day 2 preview MP4 (slow; never publishes)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zmb-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --prefer-binary -r scripts/requirements.txt

      - name: Compile Python files
        run: python -m compileall -q scripts tests

      - name: Story engine self-test
        run: python scripts/engine.py --selftest

      - name: Scheduler regression tests
        run: python -m unittest discover -s tests -v

  preview-day1:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.render_preview) }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --prefer-binary -r scripts/requirements.txt

      - name: Install renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng
          ffmpeg -version | head -n 1

      - name: Render Day 1 preview (no Instagram publishing)
        env:
          ZMB_LOCAL_AI_ENABLED: "0"
          ZMB_NO_AI: "1"
        run: |
          set -euo pipefail
          python scripts/preview_day1.py --video
          VIDEO="$(find out -maxdepth 1 -name '*.mp4' -type f -print -quit)"
          test -s "$VIDEO" || { echo "::error::No 2D MP4 produced"; exit 1; }
          python scripts/verify_2d_video.py "$VIDEO"

      - name: Upload Day 1 cinematic draft
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmb-day1-preview
          path: |
            out/*.mp4
            out/caption.txt
            out/episode.json
            out/day1_visual_manifest.json
            out/2d_qa_report.json
          if-no-files-found: error
          retention-days: 5
