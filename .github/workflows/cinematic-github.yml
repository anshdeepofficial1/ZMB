name: ZMB free-only cinematic checks (zero rupees)

on:
  push:
    branches: [main]
    paths: [".github/workflows/cinematic-github.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "plan and probe cost ₹0; one_clip uses only free HF ZeroGPU quota"
        type: choice
        required: true
        options: [plan, probe, one_clip]
        default: plan
      shot:
        description: "Day 1 shot index 0-6; one_clip requires approved first-frame PNG"
        type: string
        required: false
        default: "0"
      use_free_quota:
        description: "Consume existing 5-min/day FREE Hugging Face quota for exactly ONE clip"
        type: boolean
        required: false
        default: false
  schedule:
    # Free non-inference validation only. No automatic quota consumption.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: zmb-free-cinematic
  cancel-in-progress: false

jobs:
  verify-free-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZMB_BUDGET_RUPEES: "0"
      ZMB_PUBLISH_ENABLED: "0"
      ZMB_LOCAL_AI_ENABLED: "0"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      IG_ACCESS_TOKEN: ""
      IG_USER_ID: ""
      FAL_KEY: ""
    steps:
      - name: Checkout cinematic draft implementation (not old procedural release)
        uses: actions/checkout@v7
        with:
          ref: rebuild/comfyui-cinematic-assets
          persist-credentials: false

      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-free.txt

      - name: Install only free tools and CPU media editor
        run: |
          set -euo pipefail
          python -m pip install --prefer-binary -r scripts/requirements-free.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Verify safety and all automated rendering tests
        env:
          ZMB_LOCAL_AI_ENABLED: "1"
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python -c "import json; c=json.load(open('config.example.json')); assert c['publishing_enabled'] is False and c['cinematic_release_approved'] is False"
          python -c "from github_cloud_video import FalInference; from visual_manifest import VisualContractError; \
            exec('try:\\n FalInference()\\nexcept VisualContractError:\\n pass\\nelse:\\n raise AssertionError(\"billable inference was not blocked\")')"

      - name: Free model plan, public API probe, or one reviewed clip
        env:
          REQUEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
          REQUEST_SHOT: ${{ inputs.shot }}
          REQUEST_FREE_QUOTA: ${{ inputs.use_free_quota }}
        run: |
          set -euo pipefail
          MODE="${REQUEST_MODE:-plan}"
          SHOT="${REQUEST_SHOT:-0}"
          if [[ "$MODE" == "plan" ]]; then
            python scripts/hf_zerogpu_video.py --mode plan
          elif [[ "$MODE" == "probe" ]]; then
            python scripts/hf_zerogpu_video.py --mode probe
          elif [[ "$MODE" == "one_clip" && "$REQUEST_FREE_QUOTA" == "true" ]]; then
            test -n "$HF_TOKEN" || { echo "::error::Free Hugging Face HF_TOKEN not set"; exit 1; }
            python scripts/hf_zerogpu_video.py --mode one_clip --shot "$SHOT" --use-free-quota
          else
            echo "::error::No quota use authorized; no inference submitted."
            exit 1
          fi

      - name: Upload only zero-budget plans or UNREVIEWED video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zmb-zero-rupees-${{ github.run_id }}
          path: |
            out/free_zerogpu/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Record strict budget and review status
        if: always()
        run: |
          echo "## ZMB Zero-Rupee workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "Budget is **₹0**; fal.ai/Replicate/paid GPUs are disabled." >> "$GITHUB_STEP_SUMMARY"
          echo "Only free Hugging Face ZeroGPU quotas may be used by an explicit manual one_clip run." >> "$GITHUB_STEP_SUMMARY"
          echo "No Instagram credentials are present; all video outputs are UNREVIEWED." >> "$GITHUB_STEP_SUMMARY"
          echo "Free third-party ZeroGPU availability, daily output and cinematic quality are NOT guaranteed." >> "$GITHUB_STEP_SUMMARY"
