name: Deploy ZMB Monitor Website

on:
  push:
    branches: [main]
    paths:
      - "monitor/**"
      - ".github/workflows/deploy-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload monitor website
        uses: actions/upload-pages-artifact@v4
        with:
          path: monitor

      - name: Deploy monitor website
        id: deployment
        uses: actions/deploy-pages@v4
